# data
feeder: feeder.feeder_ntu.FeederOSE
train_feeder_args:
  data_path: ../data/MAMP/ntu/NTU60_XSub.npz
  split: train
  window_size: 120
  p_interval: [0.5, 1]
  normalization: False
  motion_noise: 0
  impulse_noise: 0
  joint_noise: [1, 0.005]
  frame_noise: [0, 0]
  vel: False
  bone: False

# model
model: model.transformer_macdiff.Transformer
model_args:
  dim_in: 3
  dim_feat: 256
  dim_t_embed: 64
  depth: 8
  decoder_depth: 5
  num_heads: 8
  mlp_ratio: 4
  num_frames: 120
  num_joints: 25
  patch_size: 1
  t_patch_size: 4
  qkv_bias: True
  qk_scale: None
  drop_rate: 0.
  attn_drop_rate: 0.
  drop_path_rate: 0.
  diff_prediction: noise
  diff_steps: 1000
  diff_noise_schedule: [inverse_cosine, 1]
  lambda_loss_uni: 0.02
  layer_mask_ratio: 0.
  uncond_ratio: 0.1
  input_mean: [-0.0058, -0.1333, -0.0246]
  input_var: [0.0206, 0.0805, 0.0218]
  one_person: True

# training
epochs: 400
warmup_epochs: 20
batch_size: 32
lr: 1e-3
min_lr: 5e-4
weight_decay: 0.05
mask_ratio: 0.9
motion_aware_tau: -1

# OSE-guided cross-instance diffusion
enable_ose: True
# Create this JSON with one immutable training-set index for every semantic class.
ose_exemplar_indices: config/ntu60_xsub_joint/exemplar_indices.json
ose_momentum: 0.999
ose_queue_size: 32768
# Epochs 0-99 use only the native MacDiff loss; OSE starts at epoch 100.
ose_start_epoch: 100
# Enable from CLI with --ose_exemplar_checkpoint when memory is constrained.
ose_exemplar_checkpoint: False
ose_refresh_interval: 1
# AimCLR OSE P1: each queue slot belongs to one class before classwise Top-K.
ose_topk: 4
ose_alpha: 0.75
ose_tau_s: 0.1
ose_tau_t: 0.04
ose_assignment_confidence: 0.8
# L_proto = L_align + L_dispersion; online exemplars keep both terms differentiable.
lambda_ose: 1.0
self_prob_start: 0.9
self_prob_end: 0.1
peer_prob_start: 0.1
peer_prob_end: 0.9
