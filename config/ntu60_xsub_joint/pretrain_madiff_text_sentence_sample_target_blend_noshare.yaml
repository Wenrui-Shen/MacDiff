# Sentence cache v3: same per-sample 0.9/0.1 target update; independent T->S decoder.
feeder: feeder.feeder_ntu.Feeder
train_feeder_args:
  data_path: ../data/MAMP/ntu/NTU60_XSub.npz
  split: train
  window_size: 120
  p_interval: [0.5, 1]
  normalization: False
  flip: False  # left/right captions must retain their original body-region meaning
  motion_noise: 0
  impulse_noise: 0
  joint_noise: [1, 0.005]
  frame_noise: [0, 0]
  vel: False
  bone: False

model: model.transformer_macdiff_text.Transformer
model_args:
  dim_in: 3
  dim_feat: 256
  dim_t_embed: 64
  depth: 8
  decoder_depth: 5
  num_heads: 8
  mlp_ratio: 4
  num_frames: 120
  num_joints: 25
  patch_size: 1
  t_patch_size: 4
  qkv_bias: True
  qk_scale: null
  drop_rate: 0.
  attn_drop_rate: 0.
  drop_path_rate: 0.
  diff_prediction: noise
  diff_steps: 1000
  diff_noise_schedule: [inverse_cosine, 1]
  lambda_loss_uni: 0.02
  layer_mask_ratio: 0.
  uncond_ratio: 0.1
  input_mean: [-0.0058, -0.1333, -0.0246]
  input_var: [0.0206, 0.0805, 0.0218]
  one_person: True
  text_input_dim: 512
  text_hidden_dim: 512
  text_context_length: 7
  text_target_mode: sample_target_blend
  text_target_norm: rms
  text_target_update_ratio: 0.1
  lambda_text_uniformity: 0.02
  text_decoder_hidden_dim: 512
  text_decoder_output_norm: 'none'  # full-width noise output; internal norms are retained
  text_decoder_depth: 5
  share_skeleton_decoder: False  # ablation: T->S owns a separate skeleton decoder

text_cache: vlm_pilot/ntu60_xsub_clip_sentence_cache_v3
text_target_bank_backend: shared_memory
lambda_text_to_skeleton: 0.1
lambda_skeleton_to_text: 0.1
epochs: 400
warmup_epochs: 20
batch_size: 64
accum_iter: 1
lr: 1.e-3
min_lr: 1.e-5
weight_decay: 0.05
mask_ratio: 0.9
motion_aware_tau: -1
output_dir: output_dir/ntu60_xsub_macdiff_sentence_sampletarget01_noshare_st512_t2s1
log_dir: output_dir/ntu60_xsub_macdiff_sentence_sampletarget01_noshare_st512_t2s1/tensorboard
