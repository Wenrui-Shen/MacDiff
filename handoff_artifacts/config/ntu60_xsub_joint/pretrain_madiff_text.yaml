# Native Stage1 settings plus global text and two independent auxiliary decoders.
feeder: feeder.feeder_ntu.Feeder
train_feeder_args:
  data_path: ../data/MAMP/ntu/NTU60_XSub.npz
  split: train
  window_size: 120
  p_interval: [0.5, 1]
  normalization: False
  motion_noise: 0
  impulse_noise: 0
  joint_noise: [1, 0.005]
  frame_noise: [0, 0]
  vel: False
  bone: False

model: model.transformer_macdiff_text.Transformer
model_args:
  dim_in: 3
  dim_feat: 256
  dim_t_embed: 64
  depth: 8
  decoder_depth: 5
  num_heads: 8
  mlp_ratio: 4
  num_frames: 120
  num_joints: 25
  patch_size: 1
  t_patch_size: 4
  qkv_bias: True
  qk_scale: null
  drop_rate: 0.
  attn_drop_rate: 0.
  drop_path_rate: 0.
  diff_prediction: noise
  diff_steps: 1000
  diff_noise_schedule: [inverse_cosine, 1]
  lambda_loss_uni: 0.02
  layer_mask_ratio: 0.
  uncond_ratio: 0.1
  input_mean: [-0.0058, -0.1333, -0.0246]
  input_var: [0.0206, 0.0805, 0.0218]
  one_person: True  # explicit native default; global text aggregates all described people
  text_input_dim: 512
  text_hidden_dim: 512
  text_decoder_hidden_dim: 256
  text_decoder_depth: 3

text_cache: vlm_pilot/ntu60_xsub_clip_cache_v1
lambda_text_to_skeleton: 1.0
lambda_skeleton_to_text: 1.0
epochs: 400
warmup_epochs: 20  # original learning-rate warmup, not an auxiliary-loss warmup
batch_size: 32
lr: 1.e-3
min_lr: 1.e-5  # match script_pretrain_madiff.sh baseline invocation
weight_decay: 0.05
mask_ratio: 0.9
motion_aware_tau: -1
output_dir: output_dir/ntu60_xsub_macdiff_text
log_dir: output_dir/ntu60_xsub_macdiff_text/tensorboard
